; Packaged defaults. On first use this file is copied to Saved/Config/BossPhase1.ini.
; Edit the Saved copy to tune an installed game. Reload P1 or restart to apply.
; Fast clear: compare Sokoban + Shooting time; subtract a fixed number of QR submissions.
[BossPhase1]
FastClearTimeThreshold=60.0
BaseRequiredSubmissionCount=5
FastClearSubmissionReductionCount=1

; Escape pad count (0..8), maximum random placement radius (cm), jump impulse.
TornadoEscapePadCount=3
TornadoEscapePadDistance=600.0
TornadoEscapePadJumpPower=2000.0
; Knockback uses the player's original immunity check. AirKick speed: smaller = slower.
TornadoKickPower=1800.0
; Seconds between tornado contacts (0.1..86400). Player knockback immunity still applies.
TornadoHitInterval=1.0
TornadoKickPlayRate=0.35
; Additional mesh jump height (world cm), and leg length relative to normal legs.
TornadoKickExtraHeight=600.0
TornadoLegLengthScale=2.8252147
; Kick-slot execution chance: 0 = disabled, 1 = original pattern.
TornadoKickChance=0.65
